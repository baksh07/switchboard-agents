services:
  mcp:
    build: .
    command: ["python", "mcp_server/crm_server.py", "http"]
    environment:
      MCP_HOST: 0.0.0.0  # listen on the container's network, not only inside it
      MCP_PORT: "8000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env  # API keys, MODEL, WEBHOOK_SECRET; read at run time, never baked into the image
    environment:
      TOOLS: mcp-http
      MCP_URL: http://mcp:8000/mcp  # "mcp" is the service name; Compose's network resolves it
    ports:
      - "8001:8000"  # host 8001 -> container 8000
    volumes:
      - data:/data
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

volumes:
  data: